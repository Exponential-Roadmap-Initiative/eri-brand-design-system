<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design and Development Hub</title>
    <meta name="description" content="The ERI Design and Development Hub — where ERI builds for climate accountability. Explore the governance model, skills registry, brand design system, and project instructions that power ERI's AI-native operations across a platform covering 52,000+ companies." />
    <!-- Favicon — PNG only (Manus hosting does not serve .ico correctly) -->
    <!-- White background, 12% corner radius, original green + black S-curve mark -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <!-- Apple Touch Icon: iOS home screen (180px) — white rounded variant -->
    <link rel="apple-touch-icon" sizes="180x180" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663319595517/5mtZtU66sMbsnmPoVbf6UJ/favicon-white-rounded-180_2daaa7d4.png" />
    <!-- Android / PWA manifest icon (192px) — white rounded variant -->
    <link rel="icon" type="image/png" sizes="192x192" href="https://d2xsxph8kpxj0f.cloudfront.net/310519663319595517/5mtZtU66sMbsnmPoVbf6UJ/favicon-white-rounded-192_54fb4338.png" />
    <!-- Fonts: Archivo (headings) + Open Sans (body)
         Self-hosted WOFF2 via @font-face in index.css (GDPR-compliant — no external font requests)
         Font files: /fonts/Archivo-{400-800}.woff2, /fonts/OpenSans-{400,600,700}.woff2 -->
    <!-- ERI theme, before any CSS or JS: with no choice stored the page follows the device's light/dark setting;
         a choice (Light / Dark / System) is kept in localStorage "eri-theme-preference". The theme in use goes to
         "eri-theme" and the "dark" class on <html>. Keep this identical to ERI_THEME_SCRIPT in @eri/components (a test checks it). -->
    <script>(function(){try{var p=localStorage.getItem('eri-theme-preference');if(p!=='light'&&p!=='dark')p='system';var d=p==='dark'||(p==='system'&&!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);var c=document.documentElement.classList;c.toggle('dark',d);c.toggle('light',!d);localStorage.setItem('eri-theme',d?'dark':'light');}catch(e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
